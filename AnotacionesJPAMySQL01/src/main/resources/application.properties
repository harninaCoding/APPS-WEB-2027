spring.application.name=AnotacionesJPAH200
spring.datasource.url=jdbc:mysql://localhost:3307/anotaciones00?createDatabaseIfNotExist=true
spring.datasource.username=harnina
spring.datasource.password=zzzz
#como queremos que trate a la bbdd en la definicion
spring.jpa.hibernate.ddl-auto=create
#para mostrar las sentencias de creacion o consulta del arranque
spring.jpa.show-sql=true
#propiedades del dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
#darle formato visual a las consultas (en la consola)
spring.jpa.properties.hibernate.format_sql=true